<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>PreceptorMed | Manutenção</title>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --oxford-blue: #002147;
            --med-blue: #0056b3;
            --muted: #64748B;
            --border: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FFFFFF;
            color: var(--oxford-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 24px;
            text-align: center;
        }

        .wrap {
            max-width: 640px;
            width: 100%;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 2vw, 16px);
            margin-bottom: 48px;
        }

        .logo-symbol {
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            color: var(--oxford-blue);
            line-height: 1;
            flex-shrink: 0;
        }

        .logo-text {
            font-family: 'Inter', sans-serif;
            font-size: clamp(2rem, 6.5vw, 3.25rem);
            font-weight: 700;
            color: var(--oxford-blue);
            letter-spacing: -1px;
            line-height: 1;
            white-space: nowrap;
        }

        .logo-text span {
            color: var(--med-blue);
            font-weight: 400;
        }

        .divider {
            width: 48px;
            height: 1px;
            background: var(--border);
            margin: 0 auto 40px;
        }

        .status {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .title {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--oxford-blue);
            margin-bottom: 20px;
        }

        .lead {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.7;
            font-weight: 400;
            max-width: 400px;
            margin: 0 auto;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 24px;
            font-size: 0.75rem;
            color: #94A3B8;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <main class="wrap">
        <span class="logo-symbol" aria-hidden="true">⚕</span>
        <h1 class="logo-text">PRECEPTOR<span>MED</span></h1>
        <div class="divider"></div>
        <p class="status">Plataforma</p>
        <h2 class="title">Manutenção</h2>
        <p class="lead">Estamos preparando uma nova experiência. Retornaremos em breve.</p>
    </main>

    <footer>©2026 PreceptorMed Technologies Inc.</footer>

</body>
</html>
